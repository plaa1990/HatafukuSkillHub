<style>html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;font-size:14px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.row2{display:flex;gap:10px;align-items:center;padding:6px 12px}.row2 input[type=range]{flex:1}input[type=color]{width:48px;height:44px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.ly button{min-width:40px;min-height:40px}#ref button{position:absolute;top:2px;right:2px;min-height:32px}.row2 label{flex:1;display:flex;gap:4px;align-items:center;color:var(--mu);font-size:12px}#brushes{border-bottom:0}#brushes button{white-space:nowrap}#hex{width:170px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:16px monospace;min-height:44px}#sw{display:flex;gap:6px}#sw button{min-width:36px;min-height:36px;width:36px;padding:0;border-radius:50%}</style></head><body>

const BR={
 pencil:{n:'ดินสอ',gap:.12,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a*.35*p;for(let i=0;i<4;i++){c.beginPath();c.arc(x+rnd(-s*.3,s*.3),y+rnd(-s*.3,s*.3),Math.max(.6,s*.22),0,7);c.fill();}}},

 water:{n:'สีน้ำ',gap:.25,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a*.045;for(let i=0;i<6;i++){c.beginPath();c.arc(x+rnd(-s*.25,s*.25),y+rnd(-s*.25,s*.25),s*rnd(.5,1)*p,0,7);c.fill();}}},
 air:{n:'แอร์บรัช',gap:.1,fn:(c,x,y,s,p,a)=>{const r=s*1.2,g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.fillStyle);g.addColorStop(1,'transparent');c.globalAlpha=a*.12*p;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);},grad:1},

 chalk:{n:'ชอล์ก/พาสเทล',gap:.15,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a*.6;for(let i=0;i<22;i++){if(Math.random()<.45)continue;c.fillRect(x+rnd(-s/2,s/2),y+rnd(-s/2,s/2),rnd(1,3.5),rnd(1,3.5));}}},
 callig:{n:'คัลลิกราฟี',gap:.08,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a;c.beginPath();c.ellipse(x,y,s*.6,Math.max(.8,s*.12),-.78,0,7);c.fill();}},
 spray:{n:'สเปรย์',gap:.3,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a*.8;for(let i=0;i<18;i++){const r=s*Math.sqrt(Math.random()),t=rnd(0,6.28);c.fillRect(x+Math.cos(t)*r,y+Math.sin(t)*r,1.4,1.4);}}},
 pencil6b:{n:'ดินสอ 6B',tip:'ร่างภาพ/ตัดเส้น กดเบาหนักได้',gap:.1,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a*.5*p;c.beginPath();c.arc(x,y,Math.max(.6,s*.3*(.4+p)),0,7);c.fill();for(let i=0;i<3;i++)c.fillRect(x+rnd(-s*.35,s*.35),y+rnd(-s*.35,s*.35),1,1);}},
 mono:{n:'โมโนไลน์',tip:'เส้นคงที่ ใช้เขียนตัวอักษร/เส้นชัดๆ',gap:.1,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a;c.beginPath();c.arc(x,y,Math.max(.6,s/2),0,7);c.fill();}},
 cloud:{n:'ก้อนเมฆ',tip:'ขอบนูนๆ ใช้เขียนหัวข้อตัวใหญ่',gap:.18,fn:(c,x,y,s,p,a)=>{c.globalAlpha=a;for(let i=0;i<6;i++){const t=i*1.047;c.beginPath();c.arc(x+Math.cos(t)*s*.3,y+Math.sin(t)*s*.3,s*.26,0,7);c.fill();}c.beginPath();c.arc(x,y,s*.32,0,7);c.fill();}},

};let pp=1;const prs=e=>e.pointerType=='pen'&&e.pressure>0?Math.max(.15,e.pressure):1,rnd=(a,b)=>a+Math.random()*(b-a),hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

function seg(a,b,wd){if(cur=='taper')return segT(a,b,wd);const s=+$('sz').value,st=Math.max(1,s*BR[cur].gap),d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/st));for(let i=1;i<=n;i++){const t=i/n,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;stamp(x,y);if(sym)stamp(W-x,y)}}
function flood(sx,sy,hex){const d=cx.getImageData(0,0,W,H).data,[fr,fg,fb]=hex2rgb(hex),i0=(sy*W+sx)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2];
const ok=i=>Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=60,seen=new Uint8Array(W*H),st=[sx+sy*W];

cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,e);if(P.size==2){if(dr){dr=false;swap(ud,[])}g0=ctr();return}if(P.size>2)return;

pp=prs(e);const p=pt(e),dt=Math.max(1,e.timeStamp-lt),sp=Math.hypot(p.x-last.x,p.y-last.y)/dt/V.s,z=+$('sz').value;

const setCol=h=>{$('col').value=h;$('hex').value=h};
function swr(){$('sw').innerHTML='';SW.forEach(h=>{const b=document.createElement('button');b.style.background=h;b.setAttribute('aria-label','สี '+h);b.onclick=()=>setCol(h);$('sw').append(b)});$('cs').style.display=SW.length?'':'none'}
function addHex(){const h=hexes($('hex').value);if(!h.length)return toast('ค่าสีไม่ถูกต้อง เช่น #E8A87C');setCol(h[0]);h.forEach(c=>{SW=SW.filter(x=>x!=c);SW.push(c)});SW=SW.slice(-40);try{localStorage.setItem('sh4sw',JSON.stringify(SW))}catch(e){}swr();toast('เก็บ '+h.length+' สี')}
$('col').oninput=()=>$('hex').value=$('col').value;
$('hex').oninput=()=>{const h=hexes($('hex').value);if(h.length)$('col').value=h[0]};
$('hex').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();addHex()}};
$('hex').onpaste=()=>setTimeout(addHex,0);$('ah').onclick=addHex;
$('cs').onclick=()=>{SW=[];try{localStorage.removeItem('sh4sw')}catch(e){}swr()};swr();
(async()=>{fit();const d=await idb('get','doc');if(d&&d.b&&d.b.length){for(let i=0;i<d.b.length;i++){const c=mk();c.getContext('2d').drawImage(await createImageBitmap(d.b[i]),0,0);LY.push({c,...d.m[i]})}act=Math.min(d.act||0,LY.length-1)}
else LY.push({c:mk(),v:true,o:1,n:'ชั้น 1'});render();list();showRef(await idb('get','ref'))})();
</script></body></html>
